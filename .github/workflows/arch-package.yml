name: Arch package
on:
  push:
    paths: ['packaging/arch/**', 'tests/test_arch_package.py', '.github/workflows/arch-package.yml']
  pull_request:
    paths: ['packaging/arch/**', 'tests/test_arch_package.py', '.github/workflows/arch-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      QT_QPA_PLATFORM: offscreen
      PACKAGER: tzkwork-sys
    steps:
      - uses: actions/checkout@v4
      - name: Use normal file extraction in the disposable container
        run: |
          # The minimal image excludes documentation directories by default.
          # Restore normal extraction rather than ignoring pacman -Qkk failures.
          pacman-conf NoExtract
          sed -i '/^[[:space:]]*NoExtract[[:space:]]*=/d' /etc/pacman.conf
      - name: Install dependencies in the disposable build container
        run: >-
          pacman -Syu --noconfirm --needed python pyside6 qt6-svg pacman-contrib fakeroot sudo polkit
          appstream xterm hicolor-icon-theme python-pytest desktop-file-utils
      - name: Build as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          runuser -u builder -- makepkg --cleanbuild --noconfirm
          runuser -u builder -- bash -c 'makepkg --printsrcinfo | diff - .SRCINFO'
      - name: Install, reinstall and remove only in the disposable container
        run: |
          pacman -U --noconfirm packaging/arch/arch-manager-*.pkg.tar.zst
          runuser -u builder -- arch-manager-gui --check
          runuser -u builder -- arch-manager-gui --version
          pacman -Qkk arch-manager
          pacman -U --noconfirm packaging/arch/arch-manager-*.pkg.tar.zst
          pacman -R --noconfirm arch-manager
          test ! -e /usr/bin/arch-manager-gui
          test ! -L /usr/bin/arch-manager-enable-snapper-read
          test ! -e /usr/lib/arch-manager/manage-applications
          test ! -e /usr/share/polkit-1/actions/org.archmanager.manage-applications.policy
          test ! -e /usr/share/polkit-1/rules.d/00-arch-manager.rules
      - uses: actions/upload-artifact@v4
        with:
          name: arch-manager-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
