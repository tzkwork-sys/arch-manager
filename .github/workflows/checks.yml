name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 desktop-file-utils
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src tests main.py
      - run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - run: bash -n recovery/arch-manager-recovery
      - run: desktop-file-validate desktop/arch-manager-gui.desktop
      - run: python -m pytest -q
